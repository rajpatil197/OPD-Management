<header class="main-healthcare-header sticky-top bg-white border-bottom shadow-sm">
  <div class="container-xl">
    <nav class="navbar navbar-expand-lg py-2">
      <!-- Brand Logo -->
      <a routerLink="/home" (click)="closeMenu()" class="navbar-brand d-flex align-items-center gap-2">
        <div class="brand-icon-box">
          <i class="bi bi-hospital fs-4 text-white"></i>
        </div>
        <div>
          <span class="fw-bold fs-5 text-dark d-block lh-1">OPD<span class="text-primary">Care</span></span>
          <small class="text-muted fw-semibold" style="font-size: 0.72rem; letter-spacing: 0.5px;">OUTPATIENT CLINIC</small>
        </div>
      </a>

      <!-- Mobile Toggle Button -->
      <button class="navbar-toggler border-0 shadow-none p-2" type="button" (click)="toggleMenu()" aria-label="Toggle navigation">
        <i class="bi" [ngClass]="isMenuOpen ? 'bi-x-lg text-dark fs-4' : 'bi-list text-dark fs-3'"></i>
      </button>

      <!-- Nav Links & Role Entry Points -->
      <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-1">
          <li class="nav-item">
            <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()" class="nav-link px-3 fw-medium">
              <i class="bi bi-house-door me-1"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a href="#portals" (click)="closeMenu()" class="nav-link px-3 fw-medium">
              <i class="bi bi-grid me-1"></i> Portals
            </a>
          </li>
          <li class="nav-item">
            <a href="#features" (click)="closeMenu()" class="nav-link px-3 fw-medium">
              <i class="bi bi-stars me-1"></i> Features
            </a>
          </li>
        </ul>

        <!-- Action Portals Navigation -->
        <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 pt-3 pt-lg-0 border-top border-lg-0">
          
          <!-- Reception Dropdown/Group -->
          <div class="portal-nav-group reception-group p-1 rounded-3">
            <span class="portal-label d-block d-lg-none px-2 py-1 text-teal fw-bold small">
              <i class="bi bi-person-badge me-1"></i> Reception Desk
            </span>
            <div class="d-flex gap-1">
              <a routerLink="/reception-login" (click)="closeMenu()" class="btn btn-sm btn-reception-login px-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Reception Login
              </a>
              <a routerLink="/reception-register" (click)="closeMenu()" class="btn btn-sm btn-reception-reg px-3">
                <i class="bi bi-person-plus me-1"></i> Register
              </a>
            </div>
          </div>

          <div class="vr d-none d-lg-block mx-1 text-muted opacity-25"></div>

          <!-- Doctor Dropdown/Group -->
          <div class="portal-nav-group doctor-group p-1 rounded-3">
            <span class="portal-label d-block d-lg-none px-2 py-1 text-primary fw-bold small">
              <i class="bi bi-heart-pulse me-1"></i> Doctor Desk
            </span>
            <div class="d-flex gap-1">
              <a routerLink="/login" (click)="closeMenu()" class="btn btn-sm btn-doctor-login px-3">
                <i class="bi bi-heart-pulse me-1"></i> Doctor Login
              </a>
              <a routerLink="/doctorregister" (click)="closeMenu()" class="btn btn-sm btn-doctor-reg px-3">
                <i class="bi bi-shield-plus me-1"></i> Register
              </a>
            </div>
          </div>

        </div>

      </div>
    </nav>
  </div>
</header>
