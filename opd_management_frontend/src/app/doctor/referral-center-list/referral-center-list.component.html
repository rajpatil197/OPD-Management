<div class="container mt-4">
  <h3>🏥 Referral Centers</h3>

  <!-- Add Form -->
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <h5>Add New Referral Center</h5>
      <form (ngSubmit)="addReferralCenter()" class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" [(ngModel)]="newReferralCenter.name" name="name" placeholder="Center name" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Type</label>
          <select class="form-select" [(ngModel)]="newReferralCenter.type" name="type">
            <option value="Hospital">Hospital</option>
            <option value="Clinic">Clinic</option>
            <option value="Lab">Lab</option>
            <option value="Pharmacy">Pharmacy</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" [(ngModel)]="newReferralCenter.address" name="address" placeholder="Address" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Contact Info</label>
          <input type="text" class="form-control" [(ngModel)]="newReferralCenter.contactInfo" name="contactInfo" placeholder="Phone or email" required>
        </div>
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-primary">Add Referral Center</button>
        </div>
      </form>
      <div *ngIf="successMsg" class="alert alert-success mt-2">{{ successMsg }}</div>
      <div *ngIf="errorMsg" class="alert alert-danger mt-2">{{ errorMsg }}</div>
    </div>
  </div>

  <!-- List -->
  <table class="table table-striped table-bordered" *ngIf="referralCenters.length > 0">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Type</th>
        <th>Address</th>
        <th>Contact Info</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of referralCenters; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ c.name }}</td>
        <td>{{ c.type }}</td>
        <td>{{ c.address }}</td>
        <td>{{ c.contactInfo || c.contact_info || c.contact }}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="deleteReferralCenter(c.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="referralCenters.length === 0" class="text-muted">No referral centers found.</p>
</div>
