<div class="mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5>📄 Visit Reports</h5>
    <button class="btn btn-sm btn-primary" (click)="showForm = !showForm">
      {{ showForm ? 'Cancel' : '+ Add Report' }}
    </button>
  </div>

  <!-- Add Form -->
  <div *ngIf="showForm" class="card mb-3">
    <div class="card-body">
      <form (ngSubmit)="addReport()">
        <div class="row">
          <div class="col-md-4 mb-2">
            <label class="form-label">File Name</label>
            <input type="text" class="form-control" [(ngModel)]="newReport.fileName" name="fileName" required placeholder="e.g. Blood Test Report">
          </div>
          <div class="col-md-3 mb-2">
            <label class="form-label">File Type</label>
            <select class="form-select" [(ngModel)]="newReport.fileType" name="fileType" required>
              <option value="PDF">PDF</option>
              <option value="Image">Image</option>
              <option value="Document">Document</option>
            </select>
          </div>
          <div class="col-md-5 mb-2">
            <label class="form-label">File URL</label>
            <input type="url" class="form-control" [(ngModel)]="newReport.fileUrl" name="fileUrl" required placeholder="https://example.com/report.pdf">
          </div>
        </div>
        <div class="d-flex justify-content-end mt-2">
          <button type="submit" class="btn btn-success">Save Report</button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>
  <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

  <!-- Table -->
  <table class="table table-striped table-bordered" *ngIf="reports.length > 0">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>File Name</th>
        <th>Type</th>
        <th>URL</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of reports; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ r.fileName }}</td>
        <td><span class="badge bg-secondary">{{ r.fileType }}</span></td>
        <td>
          <a [href]="r.fileUrl" target="_blank" rel="noopener noreferrer" class="text-truncate d-inline-block" style="max-width: 250px;">
            {{ r.fileUrl }}
          </a>
        </td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="deleteReport(r.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="reports.length === 0" class="text-muted">No visit reports found for this visit.</p>
</div>
