<div class="card shadow-sm mt-3">
  <div class="card-body">
    <h5 class="card-title text-primary">🩺 Diagnostics</h5>

    <!-- Inline Add Form -->
    <form (ngSubmit)="addDiagnostic()" class="row g-3 align-items-end mb-3">
      <div class="col-md-9">
        <label class="form-label">Diagnostic Name</label>
        <input type="text" class="form-control" [(ngModel)]="newDiagnostic.name" name="name" placeholder="Enter diagnostic name" required>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-primary w-100">Add Diagnostic</button>
      </div>
    </form>

    <div *ngIf="successMsg" class="alert alert-success py-2">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="alert alert-danger py-2">{{ errorMsg }}</div>

    <!-- Table -->
    <table class="table table-striped table-bordered mt-2" *ngIf="diagnostics && diagnostics.length > 0">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let d of diagnostics; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ d.name }}</td>
          <td>{{ d.createdDate || d.created_at || d.date || '-' }}</td>
          <td>
            <button class="btn btn-sm btn-danger" (click)="deleteDiagnostic(d.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="!diagnostics || diagnostics.length === 0" class="text-muted mb-0">No diagnostics recorded for this visit.</p>
  </div>
</div>
